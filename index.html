<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handheld Calculator</title>
    <link rel="icon" type="image/png" style="border-radius:50%;" href="./assests/favicon.png" >
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calculator">

    <div class="brand">CASIOD</div>


    <div class="display">

        <div class="lcd-status">

            <span id="memoryIndicator">M</span>

            <span id="eModeIndicator" style="display:none;">
                E
            </span>

            <span id="errorIndicator" style="display:none;">
                Error
            </span>

        </div>


        <div id="display" class="lcd-number">
            0
        </div>

    </div>



    <div class="buttons">


        <!-- Row 1 -->

        <button class="btn clear" onclick="clearDisplay()">
            C/CE
        </button>

        <button class="btn" onclick="toggleSign()">
            +/-
        </button>

        <button class="btn" onclick="squareRoot()">
            &radic;
        </button>

        <button class="btn" onclick="setOperator('%')">
            %
        </button>



        <!-- Row 2 -->

        <button class="btn" onclick="memoryClear()">MRC</button>

        <button class="btn" onclick="memoryMinus()">
            M-
        </button>

        <button class="btn" onclick="memoryPlus()">
            M+
        </button>

        <button class="btn operator" onclick="setOperator('÷')">
            ÷
        </button>




        <!-- Row 3 -->

        <button class="btn" onclick="appendNumber('7')">
            7
        </button>

        <button class="btn" onclick="appendNumber('8')">
            8
        </button>

        <button class="btn" onclick="appendNumber('9')">
            9
        </button>

        <button class="btn operator" onclick="setOperator('×')">
            ×
        </button>





        <!-- Row 4 -->

        <button class="btn" onclick="appendNumber('4')">
            4
        </button>

        <button class="btn" onclick="appendNumber('5')">
            5
        </button>

        <button class="btn" onclick="appendNumber('6')">
            6
        </button>

        <button class="btn operator" onclick="setOperator('-')">
            -
        </button>





        <!-- Row 5 -->

        <button class="btn" onclick="appendNumber('1')">
            1
        </button>

        <button class="btn" onclick="appendNumber('2')">
            2
        </button>

        <button class="btn" onclick="appendNumber('3')">
            3
        </button>

        <button class="btn operator plus-btn" onclick="setOperator('+')">
            +
        </button>





        <!-- Row 6 -->

        <button class="btn" onclick="appendNumber('0')">
            0
        </button>

        <button class="btn" onclick="appendNumber('.')">
            .
        </button>

        <button class="btn" onclick="equals()">
            =
        </button>


    </div>

</div>


<script src="script.js"></script>

</body>
</html>
